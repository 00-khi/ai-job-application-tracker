name: Backend Docker Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sunset
          POSTGRES_PASSWORD: sunset
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check required secret
        run: |
          if [ -z "${{ secrets.SUNSET_SUPABASE_JWT_ISSUER }}" ]; then
            echo "::error::SUNSET_SUPABASE_JWT_ISSUER secret is not set"
            exit 1
          fi

      - name: Create app schema in Postgres
        run: |
          docker run --rm --network host -e PGPASSWORD=sunset postgres:16 \
            psql -h 127.0.0.1 -p 5432 -U sunset -d app \
            -c "CREATE SCHEMA IF NOT EXISTS app;"

      - name: Build backend image
        run: docker build ./backend --tag sunset-backend

      - name: Run backend container
        run: |
          docker run -d --name backend \
            -p 8080:8080 \
            --add-host=host.docker.internal:host-gateway \
            -e SUNSET_DB_URL="jdbc:postgresql://host.docker.internal:5432/app" \
            -e SUNSET_DB_USERNAME=sunset \
            -e SUNSET_DB_PASSWORD=sunset \
            -e JWT_SECRET=smoke-test-dummy \
            -e SUNSET_SUPABASE_JWT_ISSUER="${{ secrets.SUNSET_SUPABASE_JWT_ISSUER }}" \
            sunset-backend

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo " — healthy after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "::error::Backend did not become healthy within 150s"
          exit 1

      - name: Test public endpoint
        run: curl -fsS http://localhost:8080/api/public/test

      - name: Show container logs on failure
        if: failure()
        run: docker logs backend
