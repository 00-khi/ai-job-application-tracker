name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUNSET_DB_URL: ${{ secrets.SUNSET_DB_URL }}
      SUNSET_DB_USERNAME: ${{ secrets.SUNSET_DB_USERNAME }}
      SUNSET_DB_PASSWORD: ${{ secrets.SUNSET_DB_PASSWORD }}
      SUNSET_SUPABASE_JWT_ISSUER: ${{ secrets.SUNSET_SUPABASE_JWT_ISSUER }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test
        run: ./mvnw clean install -B -P test

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/sunset-*.jar
          retention-days: 7
