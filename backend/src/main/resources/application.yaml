spring:
  application:
    name: sunset

  datasource:
    url: ${SUNSET_DB_URL}
    username: ${SUNSET_DB_USERNAME}
    password: ${SUNSET_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: app

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUNSET_SUPABASE_JWT_ISSUER}

  ai:
    model:
      chat: openai
      embedding: none
    openai:
      api-key: ${NVIDIA_API_KEY}
      base-url: https://integrate.api.nvidia.com/v1
      chat:
        model: deepseek-ai/deepseek-v4-flash-0731
        max-tokens: 2048
        options:
          temperature: 0.7

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

